name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores dummy para CI — testes mockam serviços externos.
  # Sobrescreva via GitHub Secrets (Settings → Secrets and variables → Actions)
  # se quiser rodar integration tests no futuro.
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'dummy-anon-key' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'dummy-service-role-key' }}
  MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://dummy:27017/petlink' }}

jobs:
  server:
    name: Server — TypeCheck, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

  mobile:
    name: Mobile — TypeCheck, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test
